<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nasteex Education Platform</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #0E7C86;
      --primary-dark: #0a5e66;
      --primary-light: #e0f4f5;
      --secondary: #F05A28;
      --secondary-light: #fff0eb;
      --dark: #0f1923;
      --dark-2: #1a2535;
      --gray: #6b7280;
      --gray-light: #f3f4f6;
      --white: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 4px 24px rgba(14,124,134,0.10);
      --shadow-lg: 0 8px 40px rgba(14,124,134,0.16);
      --radius: 16px;
      --radius-sm: 10px;
      --font-heading: 'Sora', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      color: var(--dark);
      background: #f8fafb;
      margin: 0;
    }
    h1,h2,h3,h4,h5,h6 { font-family: var(--font-heading); }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(28px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity:0; } to { opacity:1; }
    }
    @keyframes slideInLeft {
      from { opacity:0; transform:translateX(-30px); }
      to   { opacity:1; transform:translateX(0); }
    }
    @keyframes pulse {
      0%,100% { transform:scale(1); }
      50%      { transform:scale(1.05); }
    }
    @keyframes shimmer {
      0%   { background-position:-200% 0; }
      100% { background-position:200% 0; }
    }
    .animate-fadeInUp { animation: fadeInUp 0.6s ease both; }
    .animate-fadeIn   { animation: fadeIn 0.4s ease both; }

    /* ===== NAVBAR ===== */
    .navbar-custom {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 0;
      position: sticky; top:0; z-index:1000;
      box-shadow: 0 2px 16px rgba(14,124,134,0.07);
      transition: box-shadow .3s;
    }
    .navbar-brand-logo {
      display: flex; align-items:center; gap:10px;
      font-family: var(--font-heading);
      font-weight:800; font-size:1.35rem;
      color: var(--primary) !important;
      text-decoration:none;
    }
    .navbar-brand-logo .logo-icon {
      width:36px; height:36px; border-radius:10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:1rem;
    }
    .nav-link-custom {
      color: var(--dark) !important;
      font-weight:500; font-size:.93rem;
      padding: .5rem .9rem !important;
      border-radius:8px;
      transition: all .2s;
    }
    .nav-link-custom:hover { color: var(--primary) !important; background: var(--primary-light); }
    .btn-primary-custom {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color:#fff; border:none; border-radius:10px;
      padding:.52rem 1.3rem; font-weight:600; font-size:.92rem;
      transition: all .25s; cursor:pointer;
      box-shadow: 0 3px 12px rgba(14,124,134,0.28);
    }
    .btn-primary-custom:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(14,124,134,0.35); }
    .btn-secondary-custom {
      background: linear-gradient(135deg, var(--secondary), #d94e1f);
      color:#fff; border:none; border-radius:10px;
      padding:.52rem 1.3rem; font-weight:600; font-size:.92rem;
      transition: all .25s; cursor:pointer;
      box-shadow: 0 3px 12px rgba(240,90,40,0.28);
    }
    .btn-secondary-custom:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(240,90,40,0.35); }
    .btn-outline-custom {
      background:transparent; border:2px solid var(--primary);
      color:var(--primary); border-radius:10px;
      padding:.48rem 1.25rem; font-weight:600; font-size:.92rem;
      transition:all .25s; cursor:pointer;
    }
    .btn-outline-custom:hover { background:var(--primary); color:#fff; }

    /* ===== HERO ===== */
    .hero-section {
      background: linear-gradient(135deg, #0a1a2e 0%, #0E7C86 50%, #0a4a50 100%);
      min-height: 92vh;
      display:flex; align-items:center;
      position:relative; overflow:hidden;
    }
    .hero-section::before {
      content:'';
      position:absolute; inset:0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-blob {
      position:absolute; border-radius:50%;
      filter:blur(70px); opacity:.18;
    }
    .hero-blob-1 { width:500px;height:500px;background:var(--secondary);top:-100px;right:-100px; }
    .hero-blob-2 { width:350px;height:350px;background:#fff;bottom:-80px;left:10%; }
    .hero-content { position:relative; z-index:2; color:#fff; }
    .hero-badge {
      display:inline-flex; align-items:center; gap:8px;
      background:rgba(255,255,255,0.12); backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:50px; padding:.4rem 1rem;
      font-size:.82rem; font-weight:600; color:#fff; margin-bottom:1.5rem;
    }
    .hero-badge .dot { width:8px;height:8px;border-radius:50%;background:var(--secondary);animation:pulse 2s infinite; }
    .hero-title { font-size:clamp(2.2rem,5vw,3.8rem); font-weight:800; line-height:1.15; margin-bottom:1.3rem; }
    .hero-title span { color:var(--secondary); }
    .hero-subtitle { font-size:1.1rem; opacity:.85; line-height:1.7; max-width:520px; margin-bottom:2rem; }
    .hero-stats { display:flex; gap:2rem; flex-wrap:wrap; margin-top:2.5rem; }
    .hero-stat { text-align:center; }
    .hero-stat-num { font-family:var(--font-heading); font-size:1.8rem; font-weight:800; color:#fff; }
    .hero-stat-label { font-size:.8rem; opacity:.7; margin-top:.15rem; }
    .hero-card {
      background:rgba(255,255,255,0.1); backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,0.18); border-radius:20px;
      padding:1.5rem; color:#fff; position:relative;
    }
    .hero-card-img {
      width:100%; height:200px; border-radius:12px;
      background:linear-gradient(135deg,var(--secondary),#d94e1f);
      display:flex; align-items:center; justify-content:center;
      font-size:4rem; margin-bottom:1rem;
    }
    .hero-float {
      position:absolute; background:rgba(255,255,255,0.15); backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.25); border-radius:14px;
      padding:.7rem 1rem; display:flex; align-items:center; gap:.6rem;
      font-size:.82rem; color:#fff; white-space:nowrap;
    }
    .hero-float-1 { top:20px; right:-20px; animation:fadeInUp 1s 0.3s both; }
    .hero-float-2 { bottom:60px; left:-30px; animation:fadeInUp 1s 0.5s both; }

    /* ===== SECTION STYLES ===== */
    .section-tag {
      display:inline-block; background:var(--primary-light);
      color:var(--primary); font-weight:700; font-size:.8rem;
      border-radius:50px; padding:.3rem .9rem; margin-bottom:1rem; letter-spacing:.05em; text-transform:uppercase;
    }
    .section-title { font-size:clamp(1.7rem,3vw,2.5rem); font-weight:800; line-height:1.2; }
    .section-title span { color:var(--primary); }

    /* ===== COURSE CARDS ===== */
    .course-card {
      background:#fff; border-radius:var(--radius); overflow:hidden;
      box-shadow:var(--shadow); border:1px solid var(--border);
      transition:all .3s; cursor:pointer; height:100%;
    }
    .course-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-lg); }
    .course-card-img {
      height:175px; position:relative; overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      font-size:3.5rem;
    }
    .course-card-badge {
      position:absolute; top:12px; left:12px;
      background:var(--secondary); color:#fff; border-radius:6px;
      font-size:.72rem; font-weight:700; padding:.25rem .6rem;
    }
    .course-card-body { padding:1.2rem; }
    .course-card-category { font-size:.75rem; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.5rem; }
    .course-card-title { font-size:1rem; font-weight:700; line-height:1.4; margin-bottom:.6rem; color:var(--dark); }
    .course-card-instructor { font-size:.82rem; color:var(--gray); margin-bottom:.7rem; }
    .course-card-rating { display:flex; align-items:center; gap:.4rem; font-size:.82rem; margin-bottom:.7rem; }
    .stars { color:#f59e0b; }
    .course-card-footer { display:flex; align-items:center; justify-content:space-between; padding-top:.8rem; border-top:1px solid var(--border); }
    .course-price { font-size:1.15rem; font-weight:800; color:var(--primary); font-family:var(--font-heading); }
    .course-meta { display:flex; gap:1rem; font-size:.78rem; color:var(--gray); }
    .course-meta span { display:flex; align-items:center; gap:.3rem; }
    .progress-bar-custom { background:var(--primary-light); border-radius:50px; height:6px; overflow:hidden; margin-top:.5rem; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--primary),var(--secondary)); border-radius:50px; transition:width .8s ease; }

    /* ===== FEATURE CARDS ===== */
    .feature-card {
      background:#fff; border-radius:var(--radius); padding:2rem;
      box-shadow:var(--shadow); border:1px solid var(--border);
      transition:all .3s; text-align:center;
    }
    .feature-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
    .feature-icon {
      width:64px; height:64px; border-radius:16px; margin:0 auto 1.2rem;
      display:flex; align-items:center; justify-content:center; font-size:1.7rem;
    }

    /* ===== AUTH MODAL ===== */
    .modal-custom .modal-content {
      border-radius:20px; border:none; box-shadow:0 20px 60px rgba(0,0,0,0.15);
      overflow:hidden;
    }
    .modal-custom .modal-header {
      background:linear-gradient(135deg, var(--primary), var(--primary-dark));
      border:none; padding:1.5rem 2rem; color:#fff;
    }
    .modal-custom .modal-body { padding:2rem; }
    .form-control-custom {
      border:2px solid var(--border); border-radius:10px;
      padding:.75rem 1rem; font-family:var(--font-body);
      font-size:.93rem; transition:all .2s;
    }
    .form-control-custom:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(14,124,134,0.12); }
    .form-label-custom { font-weight:600; font-size:.88rem; color:var(--dark); margin-bottom:.4rem; }

    /* ===== DASHBOARD ===== */
    .dashboard-sidebar {
      width:260px; min-height:100vh; background:var(--dark);
      padding:1.5rem 0; position:fixed; left:0; top:0; z-index:500;
      transition:transform .3s;
    }
    .sidebar-logo {
      padding:0 1.5rem 1.5rem;
      border-bottom:1px solid rgba(255,255,255,.08);
      margin-bottom:1rem;
      display:flex; align-items:center; gap:.7rem;
      font-family:var(--font-heading); font-weight:800;
      color:#fff; font-size:1.1rem;
    }
    .sidebar-logo .logo-icon { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem; }
    .sidebar-nav-item {
      display:flex; align-items:center; gap:.75rem;
      padding:.72rem 1.5rem; color:rgba(255,255,255,.6);
      font-size:.9rem; font-weight:500; cursor:pointer;
      transition:all .2s; border-left:3px solid transparent; text-decoration:none;
    }
    .sidebar-nav-item:hover, .sidebar-nav-item.active {
      color:#fff; background:rgba(255,255,255,.06);
      border-left-color:var(--primary);
    }
    .sidebar-nav-item i { width:18px; text-align:center; }
    .sidebar-section-label { padding:.4rem 1.5rem; font-size:.7rem; font-weight:700; color:rgba(255,255,255,.3); letter-spacing:.1em; text-transform:uppercase; margin-top:1rem; }
    .dashboard-main { margin-left:260px; padding:2rem; min-height:100vh; background:#f8fafb; }
    .dash-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:2rem; flex-wrap:wrap; gap:1rem; }
    .dash-title { font-size:1.6rem; font-weight:800; color:var(--dark); }
    .dash-subtitle { color:var(--gray); font-size:.9rem; margin-top:.2rem; }
    .stat-card {
      background:#fff; border-radius:var(--radius); padding:1.5rem;
      box-shadow:var(--shadow); border:1px solid var(--border);
      display:flex; align-items:center; gap:1.2rem;
    }
    .stat-icon {
      width:52px; height:52px; border-radius:14px;
      display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0;
    }
    .stat-value { font-size:1.7rem; font-weight:800; font-family:var(--font-heading); color:var(--dark); }
    .stat-label { font-size:.82rem; color:var(--gray); margin-top:.2rem; }
    .stat-trend { font-size:.78rem; font-weight:600; display:flex; align-items:center; gap:.3rem; margin-top:.3rem; }
    .trend-up { color:#10b981; }
    .avatar {
      width:40px; height:40px; border-radius:50%;
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:700; font-size:.95rem; flex-shrink:0;
    }
    .activity-item { display:flex; align-items:center; gap:1rem; padding:.9rem 0; border-bottom:1px solid var(--border); }
    .activity-item:last-child { border-bottom:none; }

    /* ===== UPLOAD MODAL ===== */
    .upload-zone {
      border:2px dashed var(--primary); border-radius:var(--radius);
      padding:2.5rem; text-align:center; background:var(--primary-light);
      cursor:pointer; transition:all .2s;
    }
    .upload-zone:hover { background:#d0edf0; border-color:var(--primary-dark); }

    /* ===== VIDEO PLAYER ===== */
    .video-player-wrapper {
      background:#000; border-radius:var(--radius); overflow:hidden;
      position:relative; aspect-ratio:16/9;
      display:flex; align-items:center; justify-content:center;
    }
    .video-player-wrapper iframe { width:100%; height:100%; border:none; }
    .video-overlay {
      position:absolute; inset:0; background:rgba(0,0,0,0.5);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:opacity .3s;
    }
    .play-btn {
      width:70px; height:70px; border-radius:50%;
      background:rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center;
      font-size:1.8rem; color:var(--primary); transition:transform .2s;
    }
    .play-btn:hover { transform:scale(1.1); }

    /* ===== TOAST ===== */
    .toast-custom {
      position:fixed; bottom:2rem; right:2rem; z-index:9999;
      background:#fff; border-radius:var(--radius-sm); padding:1rem 1.5rem;
      box-shadow:0 8px 32px rgba(0,0,0,.15); border-left:4px solid var(--primary);
      display:flex; align-items:center; gap:.8rem; min-width:260px;
      animation:fadeInUp .4s ease; font-size:.9rem; font-weight:500;
    }
    .toast-custom.success { border-left-color:#10b981; }
    .toast-custom.error { border-left-color:#ef4444; }

    /* ===== FOOTER ===== */
    .footer {
      background:var(--dark); color:rgba(255,255,255,.75);
      padding:4rem 0 2rem;
    }
    .footer-brand { font-family:var(--font-heading); font-weight:800; color:#fff; font-size:1.3rem; margin-bottom:.8rem; display:flex; align-items:center; gap:.6rem; }
    .footer-desc { font-size:.87rem; line-height:1.7; max-width:300px; }
    .footer-heading { font-family:var(--font-heading); font-weight:700; color:#fff; font-size:.95rem; margin-bottom:1.2rem; }
    .footer-link { display:block; color:rgba(255,255,255,.6); font-size:.87rem; text-decoration:none; margin-bottom:.5rem; transition:color .2s; }
    .footer-link:hover { color:var(--primary); }
    .footer-social { display:flex; gap:.7rem; margin-top:1rem; }
    .social-btn { width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; color:#fff; font-size:.9rem; transition:all .2s; text-decoration:none; }
    .social-btn:hover { background:var(--primary); color:#fff; transform:translateY(-2px); }
    .footer-bottom { border-top:1px solid rgba(255,255,255,.08); margin-top:3rem; padding-top:1.5rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; font-size:.83rem; }
    .badge-custom { display:inline-flex; align-items:center; gap:.3rem; background:var(--primary-light); color:var(--primary); border-radius:6px; padding:.25rem .6rem; font-size:.76rem; font-weight:700; }
    .badge-secondary { background:var(--secondary-light); color:var(--secondary); }

    /* ===== PAGES ===== */
    .page { display:none; }
    .page.active { display:block; animation:fadeIn .3s ease; }
    .back-btn { display:inline-flex; align-items:center; gap:.5rem; color:var(--primary); font-weight:600; cursor:pointer; margin-bottom:1.5rem; padding:.4rem .8rem; border-radius:8px; transition:background .2s; background:transparent; border:none; font-size:.9rem; }
    .back-btn:hover { background:var(--primary-light); }

    /* ===== COURSE DETAIL ===== */
    .course-hero { background:linear-gradient(135deg, var(--dark), var(--dark-2)); color:#fff; padding:3rem 0; }
    .lesson-item {
      display:flex; align-items:center; gap:1rem; padding:1rem;
      border:1px solid var(--border); border-radius:var(--radius-sm);
      cursor:pointer; transition:all .2s; background:#fff; margin-bottom:.7rem;
    }
    .lesson-item:hover { border-color:var(--primary); box-shadow:0 2px 12px rgba(14,124,134,0.1); }
    .lesson-item.completed { background:var(--primary-light); border-color:var(--primary); }
    .lesson-num { width:36px; height:36px; border-radius:10px; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; flex-shrink:0; }
    .lesson-item.completed .lesson-num { background:var(--primary); color:#fff; }

    /* ===== RESPONSIVE ===== */
    @media (max-width:768px) {
      .dashboard-sidebar { transform:translateX(-100%); }
      .dashboard-sidebar.open { transform:translateX(0); }
      .dashboard-main { margin-left:0; padding:1.2rem; }
      .hero-section { min-height:auto; padding:4rem 0; }
      .hero-float { display:none; }
    }

    /* ===== ADMIN TABLE ===== */
    .admin-table { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--border); }
    .admin-table table { margin-bottom:0; }
    .admin-table thead th { background:var(--gray-light); color:var(--dark); font-weight:700; font-size:.83rem; text-transform:uppercase; letter-spacing:.05em; border:none; padding:.9rem 1rem; }
    .admin-table tbody td { padding:.85rem 1rem; border-color:var(--border); vertical-align:middle; font-size:.9rem; }
    .status-pill { border-radius:50px; padding:.25rem .75rem; font-size:.75rem; font-weight:700; display:inline-block; }
    .status-active { background:#d1fae5; color:#065f46; }
    .status-pending { background:#fef3c7; color:#92400e; }
    .status-inactive { background:#fee2e2; color:#991b1b; }

    /* overlay for mobile sidebar */
    .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:499; }
    .sidebar-overlay.show { display:block; }
  </style>
</head>
<body>

<!-- ======= APP ROOT ======= -->
<div id="app"></div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

<script>
// ============================================================

// ---- AUTH SYSTEM ----
// Admin accounts — ONLY these exact email+password pairs get admin access
const ADMIN_ACCOUNTS = [
  { email: 'admin@nasteex.com',  password: 'Admin@2024',  name: 'Super Admin'   },
  { email: 'manager@nasteex.com', password: 'Manager@2024', name: 'Platform Manager' },
];

// Registered students — stored in memory (in real app: Firebase Firestore)
const REGISTERED_USERS = [];

const AUTH = {
  login(email, password) {
    if (!email || !password) return { error: 'Fadlan buuxi goobaha oo dhan.' };
    if (!email.includes('@')) return { error: 'Email-ka saxda ah geli.' };
    if (password.length < 6) return { error: 'Password-ku waa inuu ahaado ugu yaraan 6 xaraf.' };

    // 1. Check admin accounts first — exact match only
    const adminMatch = ADMIN_ACCOUNTS.find(
      a => a.email.toLowerCase() === email.toLowerCase() && a.password === password
    );
    if (adminMatch) {
      const user = {
        uid: 'admin_' + adminMatch.email,
        email: adminMatch.email,
        name: adminMatch.name,
        role: 'admin',
        avatar: adminMatch.name[0].toUpperCase(),
        joinDate: new Date().toLocaleDateString()
      };
      STATE.user = user;
      return { user };
    }

    // 2. Check registered students
    const studentMatch = REGISTERED_USERS.find(
      u => u.email.toLowerCase() === email.toLowerCase() && u.password === password
    );
    if (studentMatch) {
      const user = {
        uid: studentMatch.uid,
        email: studentMatch.email,
        name: studentMatch.name,
        role: 'student',
        avatar: studentMatch.name[0].toUpperCase(),
        joinDate: studentMatch.joinDate
      };
      STATE.user = user;
      return { user };
    }

    // 3. Wrong credentials
    return { error: 'Email ama password-ka waa khalad. Isku day mar kale.' };
  },

  register(name, email, password) {
    if (!name || !email || !password) return { error: 'Fadlan buuxi goobaha oo dhan.' };
    if (name.trim().length < 2) return { error: 'Magacaagu waa inuu ahaado ugu yaraan 2 xaraf.' };
    if (!email.includes('@')) return { error: 'Email-ka saxda ah geli.' };
    if (password.length < 6) return { error: 'Password-ku waa inuu ahaado ugu yaraan 6 xaraf.' };

    // Block anyone trying to register with admin emails
    const isAdminEmail = ADMIN_ACCOUNTS.some(
      a => a.email.toLowerCase() === email.toLowerCase()
    );
    if (isAdminEmail) return { error: 'Email-kan lama isticmaali karo. Kale isku day.' };

    // Check if email already registered
    const alreadyExists = REGISTERED_USERS.some(
      u => u.email.toLowerCase() === email.toLowerCase()
    );
    if (alreadyExists) return { error: 'Email-kaan hore ayaa loo diiwaangeliyay. Gal account-kaaga.' };

    // Create new student account
    const newUser = {
      uid: 'student_' + Date.now(),
      email: email.trim(),
      name: name.trim(),
      password: password,   // In real app: hashed in Firebase Auth
      role: 'student',
      joinDate: new Date().toLocaleDateString()
    };
    REGISTERED_USERS.push(newUser);

    const user = {
      uid: newUser.uid,
      email: newUser.email,
      name: newUser.name,
      role: 'student',
      avatar: newUser.name[0].toUpperCase(),
      joinDate: newUser.joinDate
    };
    STATE.user = user;
    return { user };
  },

  logout() { STATE.user = null; }
};

// ---- UTILS ----
function showToast(msg, type='success') {
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  const t = document.createElement('div');
  t.className = `toast-custom ${type}`;
  t.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function navigate(page, data={}) {
  STATE.page = page;
  if (data.course) STATE.selectedCourse = data.course;
  window.scrollTo({top:0, behavior:'smooth'});
  render();
}

function formatNumber(n) {
  if (n >= 1000) return (n/1000).toFixed(1)+'k';
  return n.toString();
}

  </div>`;
}

function renderUploadModal() { return ''; } // inline form used instead

// ---- STUDENT CONTENT ----
function renderStudentContent() {
  if (STATE.dashTab === 'courses') return renderStudentCourses();
  if (STATE.dashTab === 'explore') return renderStudentExplore();
  if (STATE.dashTab === 'progress') return renderStudentProgress();
  if (STATE.dashTab === 'certificates') return renderStudentCerts();
  if (STATE.dashTab === 'profile') return renderStudentProfile();
  return '';
}

function renderStudentCourses() {
  const enrolled = STATE.courses.filter(c => STATE.enrolledCourses.includes(c.id));
  return `
  <div>
    ${enrolled.length === 0 ? `
      <div style="background:#fff;border-radius:var(--radius);padding:4rem;text-align:center;box-shadow:var(--shadow)">
        <div style="font-size:4rem;margin-bottom:1rem">📚</div>
        <h5 style="font-weight:800;margin-bottom:.5rem">No Courses Yet</h5>
        <p style="color:var(--gray);margin-bottom:1.5rem">Explore our catalog and start learning today!</p>
        <button class="btn-primary-custom" onclick="setDashTab('explore')">Browse Courses</button>
      </div>
    ` : `
      <div class="row g-4 mb-3">
        ${[
          {label:'Enrolled',value:enrolled.length,icon:'📚'},
          {label:'In Progress',value:enrolled.filter(c=>c.progress>0&&c.progress<100).length,icon:'⏳'},
          {label:'Completed',value:enrolled.filter(c=>c.progress>=100).length,icon:'✅'},
        ].map(s=>`
          <div class="col-sm-4">
            <div class="stat-card">
              <div class="stat-icon" style="background:var(--primary-light);font-size:1.4rem">${s.icon}</div>
              <div><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>
            </div>
          </div>
        `).join('')}
      </div>
      <h6 style="font-weight:800;margin-bottom:1rem">Continue Learning</h6>
      <div class="row g-4">
        ${enrolled.map(c => renderCourseCard(c, true)).join('')}
      </div>
    `}
  </div>`;
}

function renderStudentExplore() {
  const notEnrolled = STATE.courses.filter(c => !STATE.enrolledCourses.includes(c.id));
  return `
  <div>
    <h6 style="font-weight:800;margin-bottom:1rem">Explore Courses</h6>
    <div class="row g-4">
      ${notEnrolled.map(c => renderCourseCard(c)).join('')}
    </div>
    ${notEnrolled.length === 0 ? `<div style="text-align:center;padding:3rem;color:var(--gray)">🎉 You're enrolled in all available courses!</div>` : ''}
  </div>`;
}

function renderStudentProgress() {
  const enrolled = STATE.courses.filter(c => STATE.enrolledCourses.includes(c.id));
  return `
  <div>
    <h6 style="font-weight:800;margin-bottom:1.5rem">Learning Progress</h6>
    ${enrolled.length === 0 ? `<div style="text-align:center;padding:3rem;color:var(--gray)">No courses enrolled yet. <a href="#" onclick="setDashTab('explore')" style="color:var(--primary)">Explore courses →</a></div>` : `
      <div style="background:#fff;border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow);border:1px solid var(--border)">
        ${enrolled.map(c=>`
          <div style="margin-bottom:1.5rem">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
              <div style="display:flex;align-items:center;gap:.7rem"><span style="font-size:1.3rem">${c.emoji}</span><span style="font-weight:600;font-size:.9rem">${c.title}</span></div>
              <span style="font-weight:700;color:var(--primary);font-size:.9rem">${c.progress||0}%</span>
            </div>
            <div class="progress-bar-custom"><div class="progress-fill" style="width:${c.progress||0}%"></div></div>
            <div style="font-size:.78rem;color:var(--gray);margin-top:.3rem">
              ${c.progress >= 100 ? '🎉 Completed!' : `${Math.round((c.progress||0)/100*c.lessons)} of ${c.lessons} lessons done`}
            </div>
          </div>
        `).join('')}
      </div>
    `}
  </div>`;
}

function renderStudentCerts() {
  const completed = STATE.courses.filter(c => STATE.enrolledCourses.includes(c.id) && (c.progress||0) >= 100);
  return `
  <div>
    <h6 style="font-weight:800;margin-bottom:1.5rem">My Certificates</h6>
    ${completed.length === 0 ? `
      <div style="background:#fff;border-radius:var(--radius);padding:4rem;text-align:center;box-shadow:var(--shadow)">
        <div style="font-size:4rem;margin-bottom:1rem">🏆</div>
        <h5>No Certificates Yet</h5>
        <p style="color:var(--gray)">Complete a course to earn your certificate!</p>
      </div>
    ` : `
      <div class="row g-4">
        ${completed.map(c=>`
          <div class="col-md-6">
            <div style="background:linear-gradient(135deg,var(--dark),var(--dark-2));border-radius:var(--radius);padding:2rem;color:#fff;position:relative;overflow:hidden">
              <div style="position:absolute;top:-20px;right:-20px;font-size:8rem;opacity:.07">🏆</div>
              <div style="font-size:.75rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem">Certificate of Completion</div>
              <div style="font-size:1.5rem;font-weight:800;margin-bottom:.3rem">${STATE.user?.name}</div>
              <div style="font-size:.85rem;opacity:.7;margin-bottom:1rem">has successfully completed</div>
              <div style="font-size:1rem;font-weight:700;color:var(--secondary)">${c.title}</div>
              <div style="margin-top:1.5rem;display:flex;justify-content:space-between;align-items:center">
                <div style="font-size:.78rem;opacity:.6">Nasteex Education Platform</div>
                <button style="background:var(--primary);color:#fff;border:none;border-radius:8px;padding:.4rem .9rem;font-size:.8rem;cursor:pointer;font-weight:600" onclick="showToast('Certificate downloaded!','success')">Download PDF</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `}
  </div>`;
}

function renderStudentProfile() {
  return `
  <div style="max-width:600px">
    <h6 style="font-weight:800;margin-bottom:1.5rem">My Profile</h6>
    <div style="background:#fff;border-radius:var(--radius);padding:2rem;box-shadow:var(--shadow);border:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:1.2rem;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)">
        <div class="avatar" style="width:70px;height:70px;font-size:1.8rem">${STATE.user?.avatar}</div>
        <div>
          <h5 style="font-weight:800;margin-bottom:.3rem">${STATE.user?.name}</h5>
          <div style="color:var(--gray);font-size:.88rem">${STATE.user?.email}</div>
          <span class="badge-custom mt-1">Student</span>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label-custom">Full Name</label><input class="form-control-custom w-100" value="${STATE.user?.name}" id="profileName"/></div>
        <div class="col-md-6"><label class="form-label-custom">Email</label><input class="form-control-custom w-100" value="${STATE.user?.email}" readonly style="opacity:.7"/></div>
        <div class="col-12"><label class="form-label-custom">Bio</label><textarea class="form-control-custom w-100" rows="3" placeholder="Tell us about yourself..."></textarea></div>
        <div class="col-12 mt-1"><button class="btn-primary-custom" onclick="saveProfile()">Save Changes</button></div>
      </div>
    </div>
  </div>`;
}

// ============================================================
//  EVENT HANDLERS
// ============================================================
function bindEvents() {
  // Enter key on auth forms
  document.querySelectorAll('input[type=password]').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (inp.id === 'authPass') doLogin();
        if (inp.id === 'modalPass') doLogin(true);
        if (inp.id === 'authPassReg') doRegister();
        if (inp.id === 'modalRegPass') doRegister(true);
      }
    });
  });
}

function openModal(id) {
  const el = document.getElementById(id);
  if (el) new bootstrap.Modal(el).show();
}

function logoutUser() {
  AUTH.logout();
  STATE.enrolledCourses = [];
  STATE.page = 'home';
  showToast('Logged out successfully.', 'info');
  render();
}

function doLogin(isModal=false) {
  const email = document.getElementById(isModal?'modalEmail':'authEmail')?.value?.trim();
  const pass  = document.getElementById(isModal?'modalPass':'authPass')?.value;
  const res = AUTH.login(email, pass);
  if (res.error) { showToast(res.error, 'error'); return; }
  if (isModal) bootstrap.Modal.getInstance(document.getElementById('loginModal'))?.hide();
  showToast(`Welcome back, ${res.user.name}! 🎉`);
  navigate(res.user.role === 'admin' ? 'admin' : 'dashboard');
}

function doRegister(isModal=false) {
  const name  = document.getElementById(isModal?'modalName':'authName')?.value?.trim();
  const email = document.getElementById(isModal?'modalRegEmail':'authEmail')?.value?.trim();
  const pass  = document.getElementById(isModal?'modalRegPass':'authPass')?.value;
  const res = AUTH.register(name, email, pass);
  if (res.error) { showToast(res.error, 'error'); return; }
  if (isModal) bootstrap.Modal.getInstance(document.getElementById('registerModal'))?.hide();
  showToast(`Welcome to Nasteex, ${res.user.name}! 🚀`);
  navigate('dashboard');
}

function openCourse(id) {
  const course = STATE.courses.find(c => c.id === id);
  navigate('course-detail', { course });
}

function enrollCourse(id) {
  if (!STATE.user) { openModal('registerModal'); return; }
  if (!STATE.enrolledCourses.includes(id)) {
    STATE.enrolledCourses.push(id);
    const c = STATE.courses.find(c=>c.id===id);
    if (c) c.progress = 0;
    showToast(`Enrolled in "${STATE.courses.find(c=>c.id===id)?.title}"! 🎓`);
    render();
  }
}

function continueLesson(id) {
  const c = STATE.courses.find(c=>c.id===id);
  if (c) { c.progress = Math.min((c.progress||0)+15, 100); showToast('Progress updated! Keep going! 🔥'); render(); }
}

function playLesson(courseId, lessonNum) {
  if (!STATE.enrolledCourses.includes(courseId)) { enrollCourse(courseId); return; }
  const c = STATE.courses.find(c=>c.id===courseId);
  if (c) {
    c.progress = Math.min(Math.max(c.progress||0, lessonNum*12), 100);
    showToast(`Playing Lesson ${lessonNum} 🎬`);
    render();
  }
}

function filterCourses() {
  const search = document.getElementById('courseSearch')?.value?.toLowerCase()||'';
  const cat    = document.getElementById('categoryFilter')?.value||'';
  const level  = document.getElementById('levelFilter')?.value||'';
  const grid   = document.getElementById('coursesGrid');
  if (!grid) return;
  const filtered = STATE.courses.filter(c =>
    (!search || c.title.toLowerCase().includes(search) || c.instructor.toLowerCase().includes(search)) &&
    (!cat || c.category === cat) &&
    (!level || c.level === level)
  );
  grid.innerHTML = filtered.length ? filtered.map(c=>renderCourseCard(c)).join('') :
    '<div class="col-12 text-center py-5" style="color:var(--gray)"><h5>No courses found.</h5></div>';
}

function setAdminTab(tab) { STATE.adminTab = tab; render(); }
function setDashTab(tab)  { STATE.dashTab  = tab; render(); }
function toggleSidebar()  { STATE.sidebarOpen = !STATE.sidebarOpen; render(); }

function submitUpload() {
  const title = document.getElementById('uploadTitle')?.value?.trim();
  const desc  = document.getElementById('uploadDesc')?.value?.trim();
  if (!title || !desc) { showToast('Please fill in title and description.', 'error'); return; }
  const newCourse = {
    id: STATE.courses.length + 1,
    title, instructor: STATE.user?.name || 'Nasteex Instructor',
    category: document.getElementById('uploadCategory')?.value || 'Web Dev',
    emoji: '📘', color: '#1a3a5e',
    rating: 0, reviews: 0, students: 0,
    price: parseInt(document.getElementById('uploadPrice')?.value)||49,
    duration: document.getElementById('uploadDuration')?.value||'10h',
    lessons: 20, level: document.getElementById('uploadLevel')?.value||'Beginner',
    progress:0, description: desc, tags:[]
  };
  STATE.courses.push(newCourse);
  showToast(`Course "${title}" published successfully! 🚀`);
  setAdminTab('courses');
}

function adminDeleteCourse(id) {
  STATE.courses = STATE.courses.filter(c => c.id !== id);
  showToast('Course deleted.', 'info');
  render();
}

function saveProfile() {
  const name = document.getElementById('profileName')?.value?.trim();
  if (name && STATE.user) { STATE.user.name = name; STATE.user.avatar = name[0].toUpperCase(); showToast('Profile updated! ✅'); render(); }
}

// ---- BOOT ----
render();
</script>
</body>
</html>
